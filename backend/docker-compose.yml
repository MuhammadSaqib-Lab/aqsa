services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aqsa_physio
    ports:
      - "5432:5432"
    volumes:
      - aqsa_physio_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/aqsa_physio?schema=public
    ports:
      - "5000:5000"
    command: sh -c "npx prisma migrate deploy && node dist/server.js"

volumes:
  aqsa_physio_db:
