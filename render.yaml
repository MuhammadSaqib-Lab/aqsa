services:
  - type: web
    name: aqsa-physio-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: CLINIC_TIMEZONE
        value: Asia/Karachi
      - key: CLINIC_OPEN_TIME
        value: "09:00"
      - key: CLINIC_CLOSE_TIME
        value: "20:00"
      - key: CLINIC_SLOT_MINUTES
        value: "30"
      - key: CLINIC_WORKING_DAYS
        value: "1,2,3,4,5,6"
      - key: ENABLE_API_DOCS
        value: "false"
